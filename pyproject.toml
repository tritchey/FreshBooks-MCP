[project]
name = "freshbooks-mcp"
version = "0.1.0"
description = "MCP server for logging and reconciling time entries in FreshBooks."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]",
    "httpx",
]

[project.scripts]
freshbooks-mcp = "freshbooks_mcp.server:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freshbooks_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
